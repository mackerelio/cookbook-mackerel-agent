name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['2.6', '2.7']
        dist:
          - ubuntu-18.04
          - debian-9
          - centos-7
          - amazonlinux
          - amazonlinux-2
        chef-version: ['16.14.1']
      fail-fast: false

    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: Set up Ruby
      uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false
    - name: Bundle install
      # dep_selector depends on dep-selector-libgecode, which vendors an old
      # gecode-3.7.3 source tree that ships without config.guess/config.sub.
      # Its bundled configure script gets regenerated by `autoconf` during
      # `make clean`, and the regenerated version requires those aux files,
      # which used to be picked up as a side effect of the (now removed)
      # autotools-dev package. Supply them from the automake package instead.
      run: |
        bundle config --local path vendor/bundle
        bundle config --local deployment true
        sudo apt-get update
        sudo apt-get install -y automake
        automake_aux_dir=$(dirname "$(dpkg -L automake | grep -m1 'config\.guess$')")
        bundle install || true
        find vendor/bundle -type d -path '*/dep-selector-libgecode-*/ext/libgecode3/vendor/gecode-3.7.3' -print0 |
          while IFS= read -r -d '' dir; do
            cp "$automake_aux_dir/config.guess" "$automake_aux_dir/config.sub" "$dir"
          done
        bundle install
    - name: Run tests
      run: bash ci.sh
      env:
        DIST: ${{ matrix.dist }}
        CHEFVER: ${{ matrix.chef-version }}
